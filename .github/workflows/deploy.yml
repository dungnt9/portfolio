name: Deploy

# Build Docker image → push to GHCR (Watchtower on the host pulls it) → optional SSH deploy.
# Called by ci.yml after the tests pass on main; can also be run by hand (Actions → Deploy → Run workflow).
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/portfolio
      HAS_SERVER: ${{ secrets.SSH_HOST != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Required repo secrets: SSH_HOST, SSH_USER, SSH_KEY (private key), GHCR_TOKEN (PAT with read:packages)
      # Skipped until SSH_HOST is set; without a server, run the image locally with Watchtower (see README).
      - name: Deploy over SSH
        if: env.HAS_SERVER == 'true'
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -e
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u "${{ github.repository_owner }}" --password-stdin
            docker pull ${{ env.IMAGE }}:${{ github.sha }}
            docker rm -f portfolio 2>/dev/null || true
            docker run -d --name portfolio --restart unless-stopped -p 80:80 ${{ env.IMAGE }}:${{ github.sha }}
            docker image prune -f
            sleep 3 && curl -fsS http://127.0.0.1/healthz
