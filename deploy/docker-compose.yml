# Same setup as the Windows machine, for a Linux host (see README, section 6.3):
#   docker compose -f deploy/docker-compose.yml up -d
# The image is built & pushed to GHCR by GitHub Actions; Watchtower pulls new versions.
services:
  portfolio:
    image: ghcr.io/dungnt9/portfolio:latest
    container_name: portfolio
    restart: unless-stopped
    ports:
      - "8080:80"          # Cloudflare Tunnel routes dungnt.io.vn -> http://localhost:8080

  watchtower:
    image: containrrr/watchtower
    container_name: watchtower
    restart: unless-stopped
    environment:
      - DOCKER_API_VERSION=1.44   # required with Docker Engine 29+
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: --interval 60 --cleanup portfolio
